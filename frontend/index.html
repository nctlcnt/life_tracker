<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Tracker</title>
  <style>
    :root {
      --bg: #f1f3f5;
      --surface: #ffffff;
      --border: #dee2e6;
      --text: #212529;
      --text-muted: #868e96;
      --radius: 10px;
      --shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    /* ─── Header ─── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 16px; font-weight: 600; letter-spacing: .3px; }
    header .nav-date {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    header .nav-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 13px;
      color: var(--text-muted);
      transition: background .15s;
    }
    header .nav-btn:hover { background: var(--bg); }
    header input[type="date"] {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      cursor: pointer;
    }
    header .today-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--text-muted);
    }
    header .today-btn:hover { background: var(--bg); }

    /* ─── Main layout ─── */
    .main {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    /* ─── Stats panel ─── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 700;
      display: block;
      line-height: 1.2;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      display: block;
    }

    /* ─── Filter chips ─── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .chip {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface);
      color: var(--text-muted);
      transition: all .15s;
      box-shadow: var(--shadow);
    }
    .chip:hover { opacity: .8; }
    .chip.active {
      color: #fff;
      border-color: transparent;
    }

    /* ─── Timeline ─── */
    .timeline { display: flex; flex-direction: column; gap: 0; }

    /* Single card */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border-left: 4px solid #ccc;
      padding: 12px 14px;
      transition: box-shadow .15s;
    }
    .card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.12); }
    .card-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 5px;
    }
    .card-time { font-size: 12px; color: var(--text-muted); }
    .card-duration {
      font-size: 11px;
      background: var(--bg);
      padding: 1px 6px;
      border-radius: 10px;
      color: var(--text-muted);
    }
    .card-ongoing {
      font-size: 11px;
      color: #22c55e;
      font-weight: 600;
    }
    .card-content { font-size: 14px; font-weight: 500; line-height: 1.4; }
    .card-notes {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      border-left: 2px solid var(--border);
      padding-left: 8px;
    }
    .card-cat {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 600;
      opacity: .75;
    }

    /* Parallel row */
    .parallel-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .parallel-row .card { border-left-width: 4px; }

    /* Wrapper for timeline items with gap between them */
    .timeline-item { margin-bottom: 10px; }

    /* Switch marker */
    .switch-marker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0 12px;
      color: var(--text-muted);
    }
    .switch-line { flex: 1; height: 1px; background: var(--border); }
    .switch-symbol {
      font-size: 13px;
      color: #adb5bd;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
<header>
  <h1>Life Tracker</h1>
  <div class="nav-date">
    <button class="nav-btn" id="prev-day">‹</button>
    <input type="date" id="date-picker">
    <button class="nav-btn" id="next-day">›</button>
    <button class="today-btn" id="today-btn">今天</button>
  </div>
</header>

<div class="main">
  <div class="stats">
    <div class="stat-card">
      <span class="stat-value" id="stat-fragments">—</span>
      <span class="stat-label">活动片段</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-switches">—</span>
      <span class="stat-label">注意力切换</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-study">—</span>
      <span class="stat-label">有效学习时长</span>
    </div>
  </div>

  <div class="filter-bar" id="filter-bar">
    <button class="chip active" style="background:#495057;border-color:#495057" data-cat="all">全部</button>
  </div>

  <div class="timeline" id="timeline">
    <div class="loading">加载中…</div>
  </div>
</div>

<script>
  // ─── Category color map ───
  const CAT_COLORS = {
    '休息':  '#94a3b8',
    '工作':  '#3b82f6',
    '社交':  '#22c55e',
    '生活':  '#f97316',
    '健康':  '#14b8a6',
    '娱乐':  '#a855f7',
    '出行':  '#f59e0b',
    'uncategorized': '#6b7280',
  };
  function catColor(cat) { return CAT_COLORS[cat] || '#6b7280'; }

  // ─── Study categories (considered "有效学习") ───
  const STUDY_CATS = new Set(['工作']);

  // ─── Date helpers ───
  function todayStr() {
    const d = new Date();
    return d.toISOString().slice(0, 10);
  }
  function shiftDate(str, days) {
    const d = new Date(str + 'T00:00:00');
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
  }
  function formatTime(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  }
  function formatDuration(seconds) {
    if (seconds < 60) return `${Math.round(seconds)}秒`;
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    if (h === 0) return `${m}分钟`;
    return m > 0 ? `${h}小时${m}分` : `${h}小时`;
  }
  function durationSec(startIso, endIso) {
    const s = new Date(startIso);
    const e = endIso ? new Date(endIso) : new Date();
    return Math.max(0, (e - s) / 1000);
  }
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ─── Group overlapping events into time slots ───
  function groupOverlapping(events) {
    if (!events.length) return [];
    const groups = [];
    let i = 0;
    while (i < events.length) {
      const group = [events[i]];
      let maxEnd = events[i].end_time ? new Date(events[i].end_time) : null;
      let j = i + 1;
      while (j < events.length && maxEnd) {
        const nextStart = new Date(events[j].start_time);
        if (nextStart < maxEnd) {
          group.push(events[j]);
          const ne = events[j].end_time ? new Date(events[j].end_time) : null;
          if (ne && ne > maxEnd) maxEnd = ne;
          j++;
        } else break;
      }
      groups.push(group);
      i = j;
    }
    return groups;
  }

  // ─── Render a single card ───
  function renderCard(event) {
    const color = catColor(event.category);
    const sec = durationSec(event.start_time, event.end_time);
    const isOngoing = !event.end_time;
    const timeStr = formatTime(event.start_time) +
      (event.end_time ? ' – ' + formatTime(event.end_time) : '');

    return `
      <div class="card" style="border-left-color:${color}">
        <div class="card-header">
          <span class="card-time">${escHtml(timeStr)}</span>
          ${isOngoing
            ? '<span class="card-ongoing">● 进行中</span>'
            : `<span class="card-duration">${formatDuration(sec)}</span>`}
        </div>
        <div class="card-content">${escHtml(event.content)}</div>
        ${event.notes ? `<div class="card-notes">${escHtml(event.notes)}</div>` : ''}
        <div class="card-cat" style="color:${color}">${escHtml(event.category)}</div>
      </div>`;
  }

  // ─── Render a group (single or parallel) ───
  function renderGroup(group) {
    if (group.length === 1) {
      return `<div class="timeline-item">${renderCard(group[0])}</div>`;
    }
    const cards = group.map(renderCard).join('');
    return `<div class="timeline-item"><div class="parallel-row">${cards}</div></div>`;
  }

  // ─── Render switch marker ───
  function renderSwitch(prevGroup, nextGroup) {
    const from = prevGroup[0].category;
    const to   = nextGroup[0].category;
    if (from === to) return '';
    return `
      <div class="switch-marker">
        <div class="switch-line"></div>
        <div class="switch-symbol">↯ ${escHtml(from)} → ${escHtml(to)}</div>
        <div class="switch-line"></div>
      </div>`;
  }

  // ─── State ───
  let allEvents = [];
  let activeFilter = 'all';
  let currentDate = todayStr();

  // ─── Fetch & render ───
  async function load(dateStr) {
    const tl = document.getElementById('timeline');
    tl.innerHTML = '<div class="loading">加载中…</div>';

    const start = dateStr + 'T00:00:00';
    const end   = dateStr + 'T23:59:59';

    try {
      const res = await fetch(`/api/events?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
      const data = await res.json();
      allEvents = data.events || [];
      renderPage();
    } catch (e) {
      tl.innerHTML = `<div class="empty">加载失败：${escHtml(String(e))}</div>`;
    }
  }

  function renderPage() {
    const events = activeFilter === 'all'
      ? allEvents
      : allEvents.filter(e => e.category === activeFilter);

    renderStats(allEvents);       // stats always use all events
    renderFilterBar(allEvents);   // chips always show all categories
    renderTimeline(events);
  }

  function renderStats(events) {
    const groups = groupOverlapping(events);

    // Switch count: consecutive groups with different primary category
    let switches = 0;
    for (let i = 1; i < groups.length; i++) {
      if (groups[i-1][0].category !== groups[i][0].category) switches++;
    }

    // Study time
    let studySec = 0;
    for (const e of events) {
      if (STUDY_CATS.has(e.category)) studySec += durationSec(e.start_time, e.end_time);
    }

    document.getElementById('stat-fragments').textContent = events.length;
    document.getElementById('stat-switches').textContent  = switches;
    document.getElementById('stat-study').textContent     = studySec > 0 ? formatDuration(studySec) : '—';
  }

  function renderFilterBar(events) {
    const cats = [...new Set(events.map(e => e.category))].sort();
    const bar = document.getElementById('filter-bar');

    const allActive = activeFilter === 'all';
    let html = `<button class="chip${allActive ? ' active' : ''}"
                  style="${allActive ? 'background:#495057;border-color:#495057;color:#fff' : ''}"
                  data-cat="all">全部</button>`;

    for (const cat of cats) {
      const color = catColor(cat);
      const active = activeFilter === cat;
      html += `<button class="chip${active ? ' active' : ''}"
                 style="${active ? `background:${color};color:#fff` : `color:${color};border-color:${color}`}"
                 data-cat="${escHtml(cat)}">${escHtml(cat)}</button>`;
    }
    bar.innerHTML = html;

    bar.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.cat;
        renderPage();
      });
    });
  }

  function renderTimeline(events) {
    const tl = document.getElementById('timeline');
    if (!events.length) {
      tl.innerHTML = '<div class="empty">这天没有记录</div>';
      return;
    }

    const groups = groupOverlapping(events);
    let html = '';
    for (let i = 0; i < groups.length; i++) {
      if (i > 0) html += renderSwitch(groups[i-1], groups[i]);
      html += renderGroup(groups[i]);
    }
    tl.innerHTML = html;
  }

  // ─── Date picker wiring ───
  const picker = document.getElementById('date-picker');
  picker.value = currentDate;

  picker.addEventListener('change', () => {
    currentDate = picker.value;
    load(currentDate);
  });

  document.getElementById('prev-day').addEventListener('click', () => {
    currentDate = shiftDate(currentDate, -1);
    picker.value = currentDate;
    load(currentDate);
  });

  document.getElementById('next-day').addEventListener('click', () => {
    currentDate = shiftDate(currentDate, 1);
    picker.value = currentDate;
    load(currentDate);
  });

  document.getElementById('today-btn').addEventListener('click', () => {
    currentDate = todayStr();
    picker.value = currentDate;
    load(currentDate);
  });

  // ─── Init ───
  load(currentDate);
</script>
</body>
</html>
