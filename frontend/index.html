<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Tracker</title>
  <style>
    :root {
      --bg: #f1f3f5;
      --surface: #ffffff;
      --border: #dee2e6;
      --text: #212529;
      --text-muted: #868e96;
      --radius: 10px;
      --shadow: 0 1px 4px rgba(0, 0, 0, .08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    /* ─── Header ─── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .3px;
    }

    header .nav-date {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    header .nav-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 13px;
      color: var(--text-muted);
      transition: background .15s;
    }

    header .nav-btn:hover {
      background: var(--bg);
    }

    header input[type="date"] {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      cursor: pointer;
    }

    header .today-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    header .today-btn:hover {
      background: var(--bg);
    }

    /* ─── Tab bar ─── */
    .tab-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 0;
      padding: 0 24px;
      position: sticky;
      top: 53px;
      z-index: 9;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      transition: color .15s, border-color .15s;
      margin-bottom: -1px;
    }

    .tab-btn.active {
      color: var(--text);
      border-bottom-color: #495057;
    }

    .tab-btn:hover:not(.active) {
      color: var(--text);
    }

    /* ─── Main layout ─── */
    .main {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    /* ─── Stats panel ─── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      display: block;
      line-height: 1.2;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      display: block;
    }

    /* ─── Filter chips ─── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .chip {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface);
      color: var(--text-muted);
      transition: all .15s;
      box-shadow: var(--shadow);
    }

    .chip:hover {
      opacity: .8;
    }

    .chip.active {
      color: #fff;
      border-color: transparent;
    }

    /* ─── Timeline ─── */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Single card */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border-left: 4px solid #ccc;
      padding: 12px 14px;
      transition: box-shadow .15s;
    }

    .card:hover {
      box-shadow: 0 3px 10px rgba(0, 0, 0, .12);
    }

    .card-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 5px;
    }

    .card-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-duration {
      font-size: 11px;
      background: var(--bg);
      padding: 1px 6px;
      border-radius: 10px;
      color: var(--text-muted);
    }

    .card-ongoing {
      font-size: 11px;
      color: #22c55e;
      font-weight: 600;
    }

    .card-content {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
    }

    .card-notes {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      border-left: 2px solid var(--border);
      padding-left: 8px;
    }

    .card-cat {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 600;
      opacity: .75;
    }

    /* Parallel row */
    .parallel-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .parallel-row .card {
      border-left-width: 4px;
    }

    /* Wrapper for timeline items with gap between them */
    .timeline-item {
      margin-bottom: 10px;
    }

    /* Switch marker */
    .switch-marker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0 12px;
      color: var(--text-muted);
    }

    .switch-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .switch-symbol {
      font-size: 13px;
      color: #adb5bd;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
    }

    /* ─── Memories & Reminders tab ─── */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 12px;
    }

    .memory-list,
    .reminder-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 32px;
    }

    .memory-item {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border-left: 4px solid #a78bfa;
      padding: 12px 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .memory-item:hover {
      box-shadow: 0 3px 10px rgba(0, 0, 0, .12);
    }

    .memory-body {
      flex: 1;
      min-width: 0;
    }

    .memory-content {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .memory-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .badge-ai {
      background: #ede9fe;
      color: #7c3aed;
    }

    .badge-user {
      background: #dcfce7;
      color: #16a34a;
    }

    .meta-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      flex-shrink: 0;
      transition: color .15s, background .15s;
    }

    .delete-btn:hover {
      color: #ef4444;
      background: #fee2e2;
    }

    /* Reminder items */
    .reminder-item {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border-left: 4px solid #fb923c;
      padding: 12px 14px;
    }

    .reminder-item.done {
      border-left-color: #94a3b8;
      opacity: .65;
    }

    .reminder-item:hover {
      box-shadow: 0 3px 10px rgba(0, 0, 0, .12);
    }

    .reminder-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .reminder-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .badge-pending {
      background: #fff7ed;
      color: #c2410c;
    }

    .badge-triggered {
      background: #f1f5f9;
      color: #64748b;
    }

    .badge-cancelled {
      background: #fee2e2;
      color: #ef4444;
    }

    .badge-high {
      background: #fee2e2;
      color: #ef4444;
    }

    .badge-group {
      background: #e0e7ff;
      color: #4f46e5;
    }

    .reminder-action {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
    }

    .reminder-filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Life Tracker</h1>
    <div class="nav-date" id="date-nav">
      <button class="nav-btn" id="prev-day">‹</button>
      <input type="date" id="date-picker">
      <button class="nav-btn" id="next-day">›</button>
      <button class="today-btn" id="today-btn">今天</button>
    </div>
  </header>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="timeline">时间轴</button>
    <button class="tab-btn" data-tab="memories">记忆 &amp; 提醒</button>
  </nav>

  <div class="main">
    <!-- ── Tab: 时间轴 ── -->
    <div id="tab-timeline">
      <div class="stats">
        <div class="stat-card">
          <span class="stat-value" id="stat-fragments">—</span>
          <span class="stat-label">活动片段</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-switches">—</span>
          <span class="stat-label">注意力切换</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-study">—</span>
          <span class="stat-label">有效学习时长</span>
        </div>
      </div>

      <div class="filter-bar" id="filter-bar">
        <button class="chip active" style="background:#495057;border-color:#495057" data-cat="all">全部</button>
      </div>

      <div class="timeline" id="timeline">
        <div class="loading">加载中…</div>
      </div>
    </div>

    <!-- ── Tab: 记忆 & 提醒 ── -->
    <div id="tab-memories" style="display:none">
      <div class="section-title">AI 记忆</div>
      <div class="memory-list" id="memory-list">
        <div class="loading">加载中…</div>
      </div>

      <div class="section-title">提醒</div>
      <div class="reminder-filter-bar">
        <button class="chip active" style="background:#495057;border-color:#495057" data-status="all" id="rf-all">全部</button>
        <button class="chip" style="color:#c2410c;border-color:#fb923c" data-status="pending" id="rf-pending">待执行</button>
        <button class="chip" style="color:#64748b;border-color:#94a3b8" data-status="triggered" id="rf-triggered">已触发</button>
        <button class="chip" style="color:#ef4444;border-color:#fca5a5" data-status="cancelled" id="rf-cancelled">已取消</button>
      </div>
      <div class="reminder-list" id="reminder-list">
        <div class="loading">加载中…</div>
      </div>
    </div>
  </div>

  <script>
    // ─── Category color map ───
    const CAT_COLORS = {
      '休息': '#94a3b8',
      '工作': '#3b82f6',
      '社交': '#22c55e',
      '生活': '#f97316',
      '健康': '#14b8a6',
      '娱乐': '#a855f7',
      '出行': '#f59e0b',
      'uncategorized': '#6b7280',
    };
    function catColor(cat) { return CAT_COLORS[cat] || '#6b7280'; }

    const STUDY_CATS = new Set(['工作']);

    // ─── Helpers ───
    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }
    function shiftDate(str, days) {
      const d = new Date(str + 'T00:00:00');
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }
    function formatTime(isoStr) {
      if (!isoStr) return '';
      return new Date(isoStr).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }
    function formatDateTime(isoStr) {
      if (!isoStr) return '';
      return new Date(isoStr).toLocaleString('zh-CN', {
        month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    }
    function formatDuration(seconds) {
      if (seconds < 60) return `${Math.round(seconds)}秒`;
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      if (h === 0) return `${m}分钟`;
      return m > 0 ? `${h}小时${m}分` : `${h}小时`;
    }
    function durationSec(startIso, endIso) {
      const s = new Date(startIso);
      const e = endIso ? new Date(endIso) : new Date();
      return Math.max(0, (e - s) / 1000);
    }
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ─── Tab switching ───
    let activeTab = 'timeline';

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.getElementById('tab-timeline').style.display = activeTab === 'timeline' ? '' : 'none';
        document.getElementById('tab-memories').style.display = activeTab === 'memories' ? '' : 'none';
        document.getElementById('date-nav').style.display = activeTab === 'timeline' ? '' : 'none';

        if (activeTab === 'memories') loadMemoriesTab();
      });
    });

    // ─── Timeline tab ───
    function groupOverlapping(events) {
      if (!events.length) return [];
      const groups = [];
      let i = 0;
      while (i < events.length) {
        const group = [events[i]];
        let maxEnd = events[i].end_time ? new Date(events[i].end_time) : null;
        let j = i + 1;
        while (j < events.length && maxEnd) {
          const nextStart = new Date(events[j].start_time);
          if (nextStart < maxEnd) {
            group.push(events[j]);
            const ne = events[j].end_time ? new Date(events[j].end_time) : null;
            if (ne && ne > maxEnd) maxEnd = ne;
            j++;
          } else break;
        }
        groups.push(group);
        i = j;
      }
      return groups;
    }

    function renderCard(event) {
      const color = catColor(event.category);
      const sec = durationSec(event.start_time, event.end_time);
      const isOngoing = !event.end_time;
      const timeStr = formatTime(event.start_time) +
        (event.end_time ? ' – ' + formatTime(event.end_time) : '');

      return `
      <div class="card" style="border-left-color:${color}">
        <div class="card-header">
          <span class="card-time">${escHtml(timeStr)}</span>
          ${isOngoing
          ? '<span class="card-ongoing">● 进行中</span>'
          : `<span class="card-duration">${formatDuration(sec)}</span>`}
        </div>
        <div class="card-content">${escHtml(event.content)}</div>
        ${event.notes ? `<div class="card-notes">${escHtml(event.notes)}</div>` : ''}
        <div class="card-cat" style="color:${color}">${escHtml(event.category)}</div>
      </div>`;
    }

    function renderGroup(group) {
      if (group.length === 1) {
        return `<div class="timeline-item">${renderCard(group[0])}</div>`;
      }
      const cards = group.map(renderCard).join('');
      return `<div class="timeline-item"><div class="parallel-row">${cards}</div></div>`;
    }

    function renderSwitch(prevGroup, nextGroup) {
      const from = prevGroup[0].category;
      const to = nextGroup[0].category;
      if (from === to) return '';
      return `
      <div class="switch-marker">
        <div class="switch-line"></div>
        <div class="switch-symbol">↯ ${escHtml(from)} → ${escHtml(to)}</div>
        <div class="switch-line"></div>
      </div>`;
    }

    let allEvents = [];
    let activeFilter = 'all';
    let currentDate = todayStr();

    async function load(dateStr) {
      const tl = document.getElementById('timeline');
      tl.innerHTML = '<div class="loading">加载中…</div>';
      const start = dateStr + 'T00:00:00';
      const end = dateStr + 'T23:59:59';
      try {
        const res = await fetch(`/api/events?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
        const data = await res.json();
        allEvents = data.events || [];
        renderPage();
      } catch (e) {
        tl.innerHTML = `<div class="empty">加载失败：${escHtml(String(e))}</div>`;
      }
    }

    function renderPage() {
      const events = activeFilter === 'all' ? allEvents : allEvents.filter(e => e.category === activeFilter);
      renderStats(allEvents);
      renderFilterBar(allEvents);
      renderTimeline(events);
    }

    function renderStats(events) {
      const groups = groupOverlapping(events);
      let switches = 0;
      for (let i = 1; i < groups.length; i++) {
        if (groups[i - 1][0].category !== groups[i][0].category) switches++;
      }
      let studySec = 0;
      for (const e of events) {
        if (STUDY_CATS.has(e.category)) studySec += durationSec(e.start_time, e.end_time);
      }
      document.getElementById('stat-fragments').textContent = events.length;
      document.getElementById('stat-switches').textContent = switches;
      document.getElementById('stat-study').textContent = studySec > 0 ? formatDuration(studySec) : '—';
    }

    function renderFilterBar(events) {
      const cats = [...new Set(events.map(e => e.category))].sort();
      const bar = document.getElementById('filter-bar');
      const allActive = activeFilter === 'all';
      let html = `<button class="chip${allActive ? ' active' : ''}"
                  style="${allActive ? 'background:#495057;border-color:#495057;color:#fff' : ''}"
                  data-cat="all">全部</button>`;
      for (const cat of cats) {
        const color = catColor(cat);
        const active = activeFilter === cat;
        html += `<button class="chip${active ? ' active' : ''}"
                 style="${active ? `background:${color};color:#fff` : `color:${color};border-color:${color}`}"
                 data-cat="${escHtml(cat)}">${escHtml(cat)}</button>`;
      }
      bar.innerHTML = html;
      bar.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.cat;
          renderPage();
        });
      });
    }

    function renderTimeline(events) {
      const tl = document.getElementById('timeline');
      if (!events.length) {
        tl.innerHTML = '<div class="empty">这天没有记录</div>';
        return;
      }
      const groups = groupOverlapping(events);
      let html = '';
      for (let i = 0; i < groups.length; i++) {
        if (i > 0) html += renderSwitch(groups[i - 1], groups[i]);
        html += renderGroup(groups[i]);
      }
      tl.innerHTML = html;
    }

    // ─── Date picker wiring ───
    const picker = document.getElementById('date-picker');
    picker.value = currentDate;

    picker.addEventListener('change', () => {
      currentDate = picker.value;
      load(currentDate);
    });
    document.getElementById('prev-day').addEventListener('click', () => {
      currentDate = shiftDate(currentDate, -1);
      picker.value = currentDate;
      load(currentDate);
    });
    document.getElementById('next-day').addEventListener('click', () => {
      currentDate = shiftDate(currentDate, 1);
      picker.value = currentDate;
      load(currentDate);
    });
    document.getElementById('today-btn').addEventListener('click', () => {
      currentDate = todayStr();
      picker.value = currentDate;
      load(currentDate);
    });

    // ─── Memories & Reminders tab ───
    let reminderFilter = 'all';  // 'all' | 'pending' | 'triggered' | 'cancelled'

    async function loadMemoriesTab() {
      loadMemories();
      loadReminders();
    }

    async function loadMemories() {
      const list = document.getElementById('memory-list');
      list.innerHTML = '<div class="loading">加载中…</div>';
      try {
        const res = await fetch('/api/memories');
        const data = await res.json();
        renderMemories(data);
      } catch (e) {
        list.innerHTML = `<div class="empty">加载失败：${escHtml(String(e))}</div>`;
      }
    }

    function renderMemories(memories) {
      const list = document.getElementById('memory-list');
      if (!memories.length) {
        list.innerHTML = '<div class="empty">暂无记忆</div>';
        return;
      }
      list.innerHTML = memories.map(m => `
        <div class="memory-item" id="memory-${m.id}">
          <div class="memory-body">
            <div class="memory-content">${escHtml(m.content)}</div>
            <div class="memory-meta">
              <span class="badge ${m.source === 'user' ? 'badge-user' : 'badge-ai'}">
                ${m.source === 'user' ? '用户' : 'AI'}
              </span>
              <span class="meta-time">${escHtml(formatDateTime(m.created_at))}</span>
            </div>
          </div>
          <button class="delete-btn" data-id="${m.id}" title="删除">×</button>
        </div>
      `).join('');

      list.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          try {
            await fetch(`/api/memories/${id}`, { method: 'DELETE' });
            document.getElementById(`memory-${id}`)?.remove();
            if (!document.querySelector('.memory-item')) {
              list.innerHTML = '<div class="empty">暂无记忆</div>';
            }
          } catch (e) {
            alert('删除失败');
          }
        });
      });
    }

    async function loadReminders() {
      const list = document.getElementById('reminder-list');
      list.innerHTML = '<div class="loading">加载中…</div>';
      try {
        const url = reminderFilter === 'all'
          ? '/api/reminders'
          : `/api/reminders?status=${reminderFilter}`;
        const res = await fetch(url);
        const data = await res.json();
        renderReminders(data);
      } catch (e) {
        list.innerHTML = `<div class="empty">加载失败：${escHtml(String(e))}</div>`;
      }
    }

    function renderReminders(reminders) {
      const list = document.getElementById('reminder-list');
      if (!reminders.length) {
        list.innerHTML = '<div class="empty">暂无提醒</div>';
        return;
      }
      list.innerHTML = reminders.map(r => `
        <div class="reminder-item ${r.status !== 'pending' ? 'done' : ''}">
          <div class="reminder-header">
            <span class="reminder-time">${escHtml(formatDateTime(r.trigger_time))}</span>
            <span class="badge badge-${r.status}">
              ${r.status === 'pending' ? '待执行' : r.status === 'triggered' ? '已触发' : '已取消'}
            </span>
            ${r.priority === 'high' ? `<span class="badge badge-high">高优</span>` : ''}
            ${r.group_id ? `<span class="badge badge-group">组: ${escHtml(r.group_id)}</span>` : ''}
          </div>
          <div class="reminder-action" style="${r.status === 'cancelled' ? 'text-decoration: line-through; opacity: 0.7' : ''}">${escHtml(r.action)}</div>
        </div>
      `).join('');
    }

    // Reminder filter chips
    document.querySelectorAll('.reminder-filter-bar .chip').forEach(btn => {
      btn.addEventListener('click', () => {
        reminderFilter = btn.dataset.status;
        document.querySelectorAll('.reminder-filter-bar .chip').forEach(b => {
          b.classList.remove('active');
          b.style.background = '';
          const st = b.dataset.status;
          b.style.color = st === 'all' ? '' : (st === 'pending' ? '#c2410c' : st === 'triggered' ? '#64748b' : '#ef4444');
          b.style.borderColor = st === 'all' ? '' : (st === 'pending' ? '#fb923c' : st === 'triggered' ? '#94a3b8' : '#fca5a5');
        });
        btn.classList.add('active');
        btn.style.background = '#495057';
        btn.style.color = '#fff';
        btn.style.borderColor = '#495057';
        loadReminders();
      });
    });

    // ─── Init ───
    load(currentDate);
  </script>
</body>

</html>
