# MOVED: superseded by /home/ubuntu/stacks/life-tracker-staging/compose.yaml
# (Dockge-managed). Kept for reference only — do not `docker compose up` from
# this file; it fights the Dockge stack over the same project name.
#
# Staging stack — coexists with prod on the same VPS for testing local code changes.
# Builds from source (the git clone on the server), uses a second Discord bot,
# an isolated SQLite DB, and a separate port. Never touches prod's data/ or config.json.
#
# Setup (one-time):
#   cp config.json config.dev.json     # then edit: token, server.port: 8081
#   mkdir -p data-dev
#   docker compose -f docker-compose.staging.yml up -d --build
#
# Iterate (most changes — fast restart, no rebuild):
#   docker compose -f docker-compose.staging.yml restart app        # ~5s, picks up host code changes
#   cd frontend && npm run build                                    # rebuild dist; browser refresh enough
#   docker compose -f docker-compose.staging.yml logs -f app
#   docker compose -f docker-compose.staging.yml down               # stop
#
# Iterate (dependency changes — full rebuild):
#   docker compose -f docker-compose.staging.yml up -d --build      # only when requirements.txt / package.json change
#
# Notes:
# - Source dirs are bind-mounted so host edits are visible to the container.
#   Restart picks them up; no rebuild needed for Python / dist changes.
# - No litestream service: dev DB is local-only, never replicated to R2.
# - Compose project name is set explicitly so containers/networks/volumes don't
#   collide with the default prod project (named after the directory).
name: life-tracker-staging

services:
  app:
    build: .
    container_name: life-tracker-staging-app
    ports:
      - "8081:8081"
    volumes:
      - ./data-dev:/app/data
      - ./config.dev.json:/app/config.json
      # Bind-mount source for fast iteration: edit on host, `restart app` picks it up.
      - ./bot:/app/bot
      - ./api:/app/api
      - ./main.py:/app/main.py
      - ./config.py:/app/config.py
      - ./frontend/dist:/app/frontend/dist
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
