<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Log Viewer</title>
<style>
  :root {
    --bg: #f5f3f0;
    --surface: #faf9f7;
    --border: #e8e4df;
    --text: #3d3730;
    --text-muted: #8c847a;
    --accent: #9aab98;
    --accent-soft: #edf0ec;
    --warn: #c4a882;
    --warn-soft: #fdf6ee;
    --error: #c48282;
    --error-soft: #fdf0f0;
    --user-bg: #f0ede8;
    --assistant-bg: #ecf0eb;
    --system-bg: #eeedf5;
    --tool-bg: #f5f0e8;
    --tool-result-bg: #edf5f0;
    --radius: 8px;
    --font: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
    font-size: 13px;
    line-height: 1.5;
  }

  /* ---- Drop zone ---- */
  #drop-zone {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg);
    gap: 16px;
    z-index: 100;
  }
  #drop-zone.hidden { display: none; }
  #drop-zone .icon { font-size: 48px; }
  #drop-zone h2 { font-size: 18px; font-weight: 600; color: var(--text); }
  #drop-zone p { color: var(--text-muted); font-size: 13px; }
  #drop-zone .btn {
    padding: 8px 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    font-family: var(--font);
  }
  #drop-zone .btn:hover { background: #889e86; }
  #drop-zone.drag-over { background: var(--accent-soft); }
  #file-input { display: none; }

  /* ---- Layout ---- */
  #sidebar {
    width: 280px;
    min-width: 200px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #main {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---- Sidebar header ---- */
  .sidebar-header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .sidebar-header h1 { font-size: 14px; font-weight: 600; }
  .sidebar-header .file-name { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

  .reload-btn {
    padding: 4px 8px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .reload-btn:hover { background: var(--bg); }

  /* ---- Sidebar filters ---- */
  .sidebar-filters {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: none;
    cursor: pointer;
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--font);
  }
  .filter-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ---- Session list ---- */
  #session-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 8px 0;
  }

  .session-item {
    padding: 10px 16px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.1s;
  }
  .session-item:hover { background: var(--bg); }
  .session-item.active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
  }
  .session-item .s-time { font-size: 11px; color: var(--text-muted); }
  .session-item .s-trigger { font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item .s-meta { display: flex; gap: 6px; margin-top: 4px; align-items: center; }
  .session-item .s-tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    background: var(--border);
    color: var(--text-muted);
  }
  .session-item .s-tag.rounds { background: var(--accent-soft); color: var(--accent); }

  /* ---- Log items in sidebar ---- */
  .log-item {
    padding: 6px 16px;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .log-item:hover { background: var(--bg); }
  .log-item.active { background: var(--accent-soft); border-left-color: var(--accent); }
  .log-item .l-time { font-size: 10px; color: var(--text-muted); }
  .log-item .l-msg { font-size: 11px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px; }
  .log-item.WARN .l-msg, .log-item.WARNING .l-msg { color: #a0844a; }
  .log-item.ERROR .l-msg, .log-item.CRITICAL .l-msg { color: var(--error); }

  .sidebar-section-label {
    padding: 8px 16px 4px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-weight: 600;
  }

  /* ---- Main panel ---- */
  .main-header {
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .main-header h2 { font-size: 14px; font-weight: 600; }
  .main-header .meta { font-size: 11px; color: var(--text-muted); }

  #detail {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* ---- Round card ---- */
  .round-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: auto;
  }

  .round-header {
    padding: 8px 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .round-header:hover { background: var(--border); }
  .round-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .round-meta { font-size: 11px; color: var(--text-muted); flex: 1; }
  .round-toggle { font-size: 12px; color: var(--text-muted); }
  .round-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .round-body.collapsed { display: none; }

  /* ---- System prompt ---- */
  .system-block {
    border: 1px solid #dddaee;
    border-radius: 6px;
    overflow: hidden;
  }
  .system-block-header {
    padding: 6px 12px;
    background: var(--system-bg);
    font-size: 11px;
    font-weight: 600;
    color: #6c6a8e;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    user-select: none;
  }
  .system-block-header:hover { background: #e8e7f5; }
  .system-content {
    padding: 10px 12px;
    font-size: 11px;
    white-space: pre-wrap;
    font-family: var(--mono);
    color: #4a4868;
    max-height: 300px;
    overflow-y: auto;
    background: #f8f8fc;
  }
  .system-content.collapsed { display: none; }

  /* ---- Message bubble ---- */
  .msg-bubble {
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .msg-header {
    padding: 5px 12px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .msg-content { padding: 8px 12px; font-size: 12px; }

  .msg-bubble.role-user { border-color: #dcd8d0; }
  .msg-bubble.role-user .msg-header { background: var(--user-bg); color: #6b5e4a; }
  .msg-bubble.role-user .msg-content { background: #faf8f5; }

  .msg-bubble.role-assistant { border-color: #cdd8cb; }
  .msg-bubble.role-assistant .msg-header { background: var(--assistant-bg); color: #4a6448; }
  .msg-bubble.role-assistant .msg-content { background: #f8faf7; }

  /* ---- Tool use / result ---- */
  .tool-use-block {
    border: 1px solid #e0d8c8;
    border-radius: 6px;
    overflow: hidden;
    font-size: 11px;
  }
  .tool-use-header {
    padding: 4px 10px;
    background: var(--tool-bg);
    color: #7a6040;
    font-weight: 600;
    display: flex;
    gap: 8px;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .tool-use-header:hover { background: #f0e8d8; }
  .tool-name { font-family: var(--mono); font-size: 11px; }
  .tool-id { font-size: 10px; color: var(--text-muted); font-family: var(--mono); }
  .tool-body { padding: 8px 10px; background: #fffbf5; }
  .tool-body.collapsed { display: none; }
  .tool-args { font-family: var(--mono); font-size: 11px; white-space: pre-wrap; color: #4a3820; }

  .tool-result-block {
    border: 1px solid #c8dece;
    border-radius: 6px;
    overflow: hidden;
    font-size: 11px;
  }
  .tool-result-header {
    padding: 4px 10px;
    background: var(--tool-result-bg);
    color: #306048;
    font-weight: 600;
    display: flex;
    gap: 8px;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .tool-result-header:hover { background: #dff0e8; }
  .tool-result-body { padding: 8px 10px; background: #f5fbf7; }
  .tool-result-body.collapsed { display: none; }
  .tool-result-content { font-family: var(--mono); font-size: 11px; white-space: pre-wrap; color: #1a3a28; }

  /* ---- Log entry detail ---- */
  .log-detail {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .log-detail .l-level {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .log-detail .l-level.INFO { background: var(--accent-soft); color: var(--accent); }
  .log-detail .l-level.WARN, .log-detail .l-level.WARNING { background: var(--warn-soft); color: var(--warn); }
  .log-detail .l-level.ERROR, .log-detail .l-level.CRITICAL { background: var(--error-soft); color: var(--error); }
  .log-detail .l-body { font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
  .log-detail .l-logger { font-size: 11px; color: var(--text-muted); margin-top: 6px; font-family: var(--mono); }

  /* ---- Scrollbar ---- */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #ccc8c0; }

  /* ---- Text rendering ---- */
  .text-content { white-space: pre-wrap; word-break: break-word; }

  /* ---- Tools summary ---- */
  .tools-summary {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    font-size: 11px;
  }
  .tools-summary-header {
    padding: 5px 12px;
    background: var(--bg);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-muted);
    font-size: 11px;
    user-select: none;
  }
  .tools-summary-header:hover { background: var(--border); }
  .tools-names {
    padding: 8px 12px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    line-height: 1.9;
    background: var(--surface);
  }
  .tools-names.collapsed { display: none; }

  /* ---- AI Response section ---- */
  .response-divider {
    border: none;
    border-top: 1px dashed var(--border);
    margin: 6px 0;
  }
  .response-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .stop-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .stop-badge.end_turn { background: var(--accent-soft); color: var(--accent); }
  .stop-badge.tool_use { background: var(--tool-bg); color: #7a6040; }
  .stop-badge.other { background: var(--border); color: var(--text-muted); }
  .usage-info { font-size: 10px; color: var(--text-muted); }
  .no-response { font-size: 11px; color: var(--text-muted); font-style: italic; padding: 4px 0; }
</style>
</head>
<body>

<!-- Drop zone -->
<div id="drop-zone">
  <div class="icon">📋</div>
  <h2>Test Log Viewer</h2>
  <p>拖拽 .jsonl 文件到这里，或点击选择</p>
  <button class="btn" onclick="document.getElementById('file-input').click()">选择文件</button>
  <input type="file" id="file-input" accept=".jsonl,.json">
</div>

<!-- Sidebar -->
<div id="sidebar" style="display:none">
  <div class="sidebar-header">
    <div>
      <h1>Log Viewer</h1>
      <div class="file-name" id="file-label"></div>
    </div>
    <button class="reload-btn" onclick="resetViewer()">换文件</button>
  </div>
  <div class="sidebar-filters">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">全部</button>
    <button class="filter-btn" data-filter="ai" onclick="setFilter('ai', this)">AI 对话</button>
    <button class="filter-btn" data-filter="log" onclick="setFilter('log', this)">日志</button>
  </div>
  <div id="session-list"></div>
</div>

<!-- Main -->
<div id="main" style="display:none">
  <div class="main-header" id="main-header" style="display:none">
    <h2 id="detail-title"></h2>
    <div class="meta" id="detail-meta"></div>
  </div>
  <div id="placeholder">← 选择左侧条目查看详情</div>
  <div id="detail" style="display:none"></div>
</div>

<script>
let allEntries = [];
let sessions = [];
let currentFilter = 'all';

// ---- File loading ----
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n').filter(l => l.trim());
    allEntries = lines.map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
    document.getElementById('file-label').textContent = file.name;
    buildSessions();
    showUI();
    renderSidebar();
  };
  reader.readAsText(file);
}

function resetViewer() {
  allEntries = []; sessions = [];
  document.getElementById('sidebar').style.display = 'none';
  document.getElementById('main').style.display = 'none';
  dropZone.classList.remove('hidden');
  fileInput.value = '';
}

function showUI() {
  dropZone.classList.add('hidden');
  document.getElementById('sidebar').style.display = 'flex';
  document.getElementById('main').style.display = 'flex';
}

// ---- Build sessions ----
// Each AI session = {type:'ai', ts, provider, model, trigger, rounds:[{num, prompt, response}]}
// Log entries are standalone items; they do NOT break AI session grouping.
function buildSessions() {
  sessions = [];
  let currentAiSession = null;

  for (let i = 0; i < allEntries.length; i++) {
    const entry = allEntries[i];
    entry._index = i;

    if (entry.type === 'ai_prompt') {
      if (entry.round === 1) {
        // Start a new AI session
        currentAiSession = {
          type: 'ai',
          id: sessions.length,
          ts: entry.ts,
          provider: entry.provider,
          model: entry.model,
          trigger: extractTrigger(entry),
          rounds: [{ num: 1, prompt: entry, response: null }],
        };
        sessions.push(currentAiSession);
      } else if (currentAiSession) {
        let rd = currentAiSession.rounds.find(r => r.num === entry.round);
        if (rd) { rd.prompt = entry; }
        else { currentAiSession.rounds.push({ num: entry.round, prompt: entry, response: null }); }
      }
    } else if (entry.type === 'ai_response') {
      if (currentAiSession) {
        let rd = currentAiSession.rounds.find(r => r.num === entry.round);
        if (rd) { rd.response = entry; }
        else { currentAiSession.rounds.push({ num: entry.round, prompt: null, response: entry }); }
      }
    } else if (entry.type === 'log') {
      // Log entries appear inline in the sidebar but do NOT reset the current AI session
      sessions.push({ type: 'log', id: sessions.length, ts: entry.ts, level: entry.level, logger: entry.logger, msg: entry.msg, _index: i });
    }
  }
}

// Extract the trigger message text from the first round's prompt payload
function extractTrigger(entry) {
  const parts = extractPromptParts(entry);
  const msgs = parts.messages;
  for (let i = msgs.length - 1; i >= 0; i--) {
    const m = msgs[i];
    if (m.role === 'user') {
      const c = m.content;
      if (typeof c === 'string') return c.replace(/^\[.*?\]\s*/, '').substring(0, 80);
      if (Array.isArray(c)) {
        const text = c.find(x => x.type === 'text');
        if (text) return text.text.substring(0, 80);
      }
    }
  }
  return '(no message)';
}

// Normalize provider-specific prompt payload to {system, messages, tools}
function extractPromptParts(promptEntry) {
  const p = promptEntry.payload || {};
  const provider = promptEntry.provider || '';

  if (provider === 'relay') {
    // OpenAI format: messages array includes {role:'system',...} prepended
    const allMsgs = p.messages || [];
    const systemMsgs = allMsgs.filter(m => m.role === 'system');
    const chatMsgs = allMsgs.filter(m => m.role !== 'system');
    return {
      system: systemMsgs.map(m => ({ text: typeof m.content === 'string' ? m.content : JSON.stringify(m.content) })),
      messages: chatMsgs,
      tools: p.tools || [],
    };
  } else if (provider === 'gemini') {
    // Gemini format: systemInstruction + contents + tools
    const sysText = p.systemInstruction?.parts?.[0]?.text || '';
    const messages = (p.contents || []).map(c => ({
      role: c.role === 'model' ? 'assistant' : 'user',
      content: c.parts,
    }));
    const toolDecls = p.tools?.[0]?.functionDeclarations || [];
    return {
      system: sysText ? [{ text: sysText }] : [],
      messages,
      tools: toolDecls.map(d => ({ name: d.name })),
    };
  } else {
    // Claude format: direct {system, messages, tools}
    return {
      system: p.system || [],
      messages: p.messages || [],
      tools: p.tools || [],
    };
  }
}

// Normalize provider-specific response to {stop_reason, content:[{type,text?,...}], usage?}
function normalizeResponse(responseEntry) {
  if (!responseEntry) return null;
  const provider = responseEntry.provider || '';
  const data = responseEntry.response || {};

  if (provider === 'claude') {
    // Already serialized by our backend: {stop_reason, content:[{type,...}], usage}
    return {
      stop_reason: data.stop_reason || 'unknown',
      content: data.content || [],
      usage: data.usage || null,
    };
  } else if (provider === 'relay') {
    // OpenAI format
    const choice = (data.choices || [])[0] || {};
    const msg = choice.message || {};
    const content = [];
    if (msg.content) content.push({ type: 'text', text: msg.content });
    for (const tc of (msg.tool_calls || [])) {
      let input = {};
      try { input = JSON.parse(tc.function?.arguments || '{}'); } catch {}
      content.push({ type: 'tool_use', id: tc.id, name: tc.function?.name, input });
    }
    return {
      stop_reason: choice.finish_reason || 'unknown',
      content,
      usage: data.usage || null,
    };
  } else if (provider === 'gemini') {
    // Gemini format
    const candidate = (data.candidates || [])[0] || {};
    const parts = candidate.content?.parts || [];
    const content = [];
    for (const part of parts) {
      if (part.text) content.push({ type: 'text', text: part.text });
      else if (part.functionCall) content.push({ type: 'tool_use', name: part.functionCall.name, input: part.functionCall.args });
    }
    const meta = data.usageMetadata || {};
    return {
      stop_reason: candidate.finishReason || 'unknown',
      content,
      usage: meta.totalTokenCount ? { input_tokens: meta.promptTokenCount, output_tokens: meta.candidatesTokenCount } : null,
    };
  }
  return { stop_reason: 'unknown', content: [], usage: null };
}

// ---- Sidebar ----
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('session-list');
  list.innerHTML = '';

  const filtered = sessions.filter(s => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'ai') return s.type === 'ai';
    if (currentFilter === 'log') return s.type === 'log';
    return true;
  });

  filtered.forEach(s => {
    const el = document.createElement('div');
    if (s.type === 'ai') {
      el.className = 'session-item';
      el.innerHTML = `
        <div class="s-time">${formatTs(s.ts)}</div>
        <div class="s-trigger">${escHtml(s.trigger)}</div>
        <div class="s-meta">
          <span class="s-tag">${escHtml(s.provider)}</span>
          <span class="s-tag rounds">${s.rounds.length} 轮</span>
        </div>
      `;
      el.addEventListener('click', () => { selectItem(el); showSession(s); });
    } else {
      const lvl = s.level || 'INFO';
      el.className = `log-item ${lvl}`;
      el.innerHTML = `
        <div class="l-time">${formatTs(s.ts)}</div>
        <div class="l-msg">${escHtml(s.msg || '')}</div>
      `;
      el.addEventListener('click', () => { selectItem(el); showLog(s); });
    }
    list.appendChild(el);
  });
}

function selectItem(el) {
  document.querySelectorAll('.session-item, .log-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
}

// ---- Detail views ----
function showSession(s) {
  document.getElementById('placeholder').style.display = 'none';
  const detail = document.getElementById('detail');
  detail.style.display = 'flex';
  detail.innerHTML = '';

  const hdr = document.getElementById('main-header');
  hdr.style.display = 'flex';
  document.getElementById('detail-title').textContent = `${s.provider} / ${s.model}`;
  document.getElementById('detail-meta').textContent = `${formatTs(s.ts)} · ${s.rounds.length} round(s)`;

  s.rounds.forEach((round, ri) => {
    detail.appendChild(renderRound(round, ri, s.rounds.length));
  });
}

function showLog(s) {
  document.getElementById('placeholder').style.display = 'none';
  const detail = document.getElementById('detail');
  detail.style.display = 'flex';
  detail.innerHTML = '';

  const hdr = document.getElementById('main-header');
  hdr.style.display = 'flex';
  document.getElementById('detail-title').textContent = 'Log Entry';
  document.getElementById('detail-meta').textContent = formatTs(s.ts);

  const el = document.createElement('div');
  el.className = 'log-detail';
  el.innerHTML = `
    <div class="l-level ${s.level || 'INFO'}">${s.level || 'INFO'}</div>
    <div class="l-body">${escHtml(s.msg || '')}</div>
    <div class="l-logger">${escHtml(s.logger || '')}</div>
  `;
  detail.appendChild(el);
}

// ---- Round renderer ----
// round = {num, prompt: ai_prompt_entry | null, response: ai_response_entry | null}
function renderRound(round, ri, total) {
  const card = document.createElement('div');
  card.className = 'round-card';

  const promptEntry = round.prompt;
  const responseEntry = round.response;
  const parts = promptEntry ? extractPromptParts(promptEntry) : { system: [], messages: [], tools: [] };
  const { system: sys, messages: msgs, tools } = parts;

  const header = document.createElement('div');
  header.className = 'round-header';
  const toolsBadge = tools.length ? ` · ${tools.length} tools` : '';
  const respBadge = responseEntry ? '' : ' · (no response yet)';
  header.innerHTML = `
    <span class="round-badge">Round ${round.num}</span>
    <span class="round-meta">${formatTs(promptEntry?.ts || responseEntry?.ts || '')} · ${msgs.length} msg(s)${sys.length ? ' · system' : ''}${toolsBadge}${respBadge}</span>
    <span class="round-toggle">▾</span>
  `;
  card.appendChild(header);

  const body = document.createElement('div');
  body.className = 'round-body';
  card.appendChild(body);

  header.addEventListener('click', () => {
    body.classList.toggle('collapsed');
    header.querySelector('.round-toggle').textContent = body.classList.contains('collapsed') ? '▸' : '▾';
  });

  // System prompts (collapsed by default)
  sys.forEach((s, si) => {
    const sb = document.createElement('div');
    sb.className = 'system-block';
    const cacheInfo = s.cache_control ? ` [${s.cache_control.type}]` : '';
    sb.innerHTML = `<div class="system-block-header" onclick="toggleCollapse(this.nextElementSibling)">
      System Prompt${sys.length > 1 ? ` #${si+1}` : ''}${cacheInfo} <span>▸ (click to expand)</span>
    </div>
    <div class="system-content collapsed">${escHtml(s.text || '')}</div>`;
    body.appendChild(sb);
  });

  // Messages
  msgs.forEach((msg, mi) => {
    const isLast = mi === msgs.length - 1;
    body.appendChild(renderMessage(msg, isLast && msg.role === 'user'));
  });

  // Tools list (collapsed by default)
  if (tools.length > 0) {
    const tb = document.createElement('div');
    tb.className = 'tools-summary';
    const names = tools.map(t => t.name || t.function?.name || '?').join('\n');
    tb.innerHTML = `<div class="tools-summary-header" onclick="toggleCollapse(this.nextElementSibling)">
      <span>Tools (${tools.length})</span><span>▸</span>
    </div>
    <div class="tools-names collapsed">${escHtml(names)}</div>`;
    body.appendChild(tb);
  }

  // AI Response
  const divider = document.createElement('hr');
  divider.className = 'response-divider';
  body.appendChild(divider);
  body.appendChild(renderResponse(responseEntry));

  return card;
}

// ---- Response renderer ----
function renderResponse(responseEntry) {
  const container = document.createElement('div');

  const norm = normalizeResponse(responseEntry);
  if (!norm) {
    const p = document.createElement('div');
    p.className = 'no-response';
    p.textContent = '(等待响应...)';
    container.appendChild(p);
    return container;
  }

  // Header: stop_reason + token usage
  const hdr = document.createElement('div');
  hdr.className = 'response-header';

  const stopClass = norm.stop_reason === 'end_turn' ? 'end_turn'
    : (norm.stop_reason === 'tool_use' || norm.stop_reason === 'tool_calls') ? 'tool_use'
    : 'other';
  const badge = document.createElement('span');
  badge.className = `stop-badge ${stopClass}`;
  badge.textContent = norm.stop_reason;
  hdr.appendChild(badge);

  if (norm.usage) {
    const u = norm.usage;
    const inp = u.input_tokens || 0;
    const out = u.output_tokens || 0;
    const cacheRead = u.cache_read_input_tokens || 0;
    const cacheCreate = u.cache_creation_input_tokens || 0;
    let usageStr = `${inp} in / ${out} out`;
    if (cacheRead) usageStr += ` · cache hit ${cacheRead}`;
    if (cacheCreate) usageStr += ` · cache write ${cacheCreate}`;
    const uspan = document.createElement('span');
    uspan.className = 'usage-info';
    uspan.textContent = usageStr;
    hdr.appendChild(uspan);
  }
  container.appendChild(hdr);

  // Content blocks
  for (const block of norm.content) {
    if (block.type === 'text' && block.text) {
      container.appendChild(renderTextContent(block.text));
    } else if (block.type === 'tool_use') {
      container.appendChild(renderToolUse(block));
    }
  }

  return container;
}

// ---- Message bubble ----
function renderMessage(msg, isLatestTrigger) {
  const bubble = document.createElement('div');
  bubble.className = `msg-bubble role-${msg.role}`;

  const roleLabel = msg.role === 'user' ? 'User' : 'Assistant';
  const triggerBadge = isLatestTrigger ? ' <span style="font-size:10px;background:#ffeaa0;color:#7a5a00;padding:1px 6px;border-radius:8px;margin-left:6px">trigger</span>' : '';
  bubble.innerHTML = `<div class="msg-header">${roleLabel}${triggerBadge}</div>`;

  const contentEl = document.createElement('div');
  contentEl.className = 'msg-content';

  const content = msg.content;
  if (typeof content === 'string') {
    contentEl.appendChild(renderTextContent(content));
  } else if (Array.isArray(content)) {
    content.forEach(item => {
      if (typeof item === 'string') {
        contentEl.appendChild(renderPythonRepr(item));
      } else if (item.type === 'text') {
        contentEl.appendChild(renderTextContent(item.text || ''));
      } else if (item.type === 'tool_use') {
        contentEl.appendChild(renderToolUse(item));
      } else if (item.type === 'tool_result') {
        contentEl.appendChild(renderToolResult(item));
      } else {
        const pre = document.createElement('pre');
        pre.style.cssText = 'font-size:11px;color:var(--text-muted);';
        pre.textContent = JSON.stringify(item, null, 2);
        contentEl.appendChild(pre);
      }
    });
  }

  bubble.appendChild(contentEl);
  return bubble;
}

function renderTextContent(text) {
  const div = document.createElement('div');
  div.className = 'text-content';
  const parts = text.split(/(<think>[\s\S]*?<\/think>)/g);
  parts.forEach(part => {
    const m = part.match(/^<think>([\s\S]*?)<\/think>$/);
    if (m) {
      const thinkEl = document.createElement('div');
      thinkEl.style.cssText = 'background:#f5f0f8;border:1px solid #e0d8ea;border-radius:4px;padding:6px 10px;margin:4px 0;font-size:11px;color:#6a5080;';
      thinkEl.innerHTML = `<span style="font-size:10px;font-weight:600;color:#8060a0;display:block;margin-bottom:4px">💭 think</span><span style="white-space:pre-wrap">${escHtml(m[1])}</span>`;
      div.appendChild(thinkEl);
    } else if (part) {
      const span = document.createElement('span');
      span.style.whiteSpace = 'pre-wrap';
      span.textContent = part;
      div.appendChild(span);
    }
  });
  return div;
}

function renderPythonRepr(str) {
  const toolMatch = str.match(/ToolUseBlock\(id='([^']+)',\s*(?:caller=[^,]+,\s*)?input=(\{.*\}),\s*name='([^']+)',\s*type='tool_use'\)/s);
  if (toolMatch) {
    let input = {};
    try { input = JSON.parse(toolMatch[2].replace(/'/g, '"')); } catch {
      try { input = eval('(' + toolMatch[2] + ')'); } catch { input = toolMatch[2]; }
    }
    return renderToolUse({ id: toolMatch[1], name: toolMatch[3], input });
  }
  const div = document.createElement('div');
  div.style.cssText = 'font-family:var(--mono);font-size:11px;white-space:pre-wrap;color:var(--text-muted);';
  div.textContent = str;
  return div;
}

function renderToolUse(item) {
  const el = document.createElement('div');
  el.className = 'tool-use-block';
  const inputStr = typeof item.input === 'string' ? item.input : JSON.stringify(item.input || {}, null, 2);
  el.innerHTML = `
    <div class="tool-use-header" onclick="toggleCollapse(this.nextElementSibling)">
      <span>🔧</span>
      <span class="tool-name">${escHtml(item.name || '?')}</span>
      <span class="tool-id">${escHtml(item.id || '')}</span>
    </div>
    <div class="tool-body">
      <pre class="tool-args">${escHtml(inputStr)}</pre>
    </div>
  `;
  return el;
}

function renderToolResult(item) {
  const el = document.createElement('div');
  el.className = 'tool-result-block';
  let content = '';
  if (typeof item.content === 'string') {
    content = item.content;
  } else if (Array.isArray(item.content)) {
    content = item.content.map(c => c.text || JSON.stringify(c)).join('\n');
  } else {
    content = JSON.stringify(item.content || {}, null, 2);
  }
  const isError = item.is_error ? ' ⚠️ error' : '';
  el.innerHTML = `
    <div class="tool-result-header" onclick="toggleCollapse(this.nextElementSibling)">
      <span>📥</span>
      <span class="tool-name">tool_result${isError}</span>
      <span class="tool-id">${escHtml(item.tool_use_id || '')}</span>
    </div>
    <div class="tool-result-body">
      <pre class="tool-result-content">${escHtml(content)}</pre>
    </div>
  `;
  return el;
}

// ---- Helpers ----
function toggleCollapse(el) {
  el.classList.toggle('collapsed');
  const hdr = el.previousElementSibling;
  if (hdr) {
    const sp = hdr.querySelector('span:last-child');
    if (sp && sp.textContent.includes('▸')) sp.textContent = '▾ (collapse)';
    else if (sp) sp.textContent = '▸ (click to expand)';
  }
}

function formatTs(ts) {
  if (!ts) return '';
  return ts.replace('T', ' ').substring(0, 19);
}

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
