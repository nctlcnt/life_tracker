# Triggered when you push a version tag: git tag v1.0.0 && git push origin v1.0.0
# Builds the Docker image and pushes two tags to GitHub Container Registry:
#   ghcr.io/nctlcnt/life_tracker:v1.0.0   ← pinned, immutable
#   ghcr.io/nctlcnt/life_tracker:stable   ← always points to latest release
name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/life_tracker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:stable
          # Layer cache: speeds up subsequent builds significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max
